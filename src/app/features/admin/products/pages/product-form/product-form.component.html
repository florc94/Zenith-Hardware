<div class="admin-page admin-page--narrow">

  <!-- =====================================================
       VOLVER A PRODUCTOS
       ===================================================== -->

  <a
    routerLink="/admin/products"
    class="back-link"
    i18n="Enlace para volver a la lista de productos@@productFormBack"
  >
    ← Volver a productos
  </a>


  <!-- =====================================================
       TÍTULO
       ===================================================== -->

  @if (productId) {

    <h1
      i18n="Título del formulario para editar un producto@@productFormEditTitle"
    >
      Editar producto
    </h1>

  } @else {

    <h1
      i18n="Título del formulario para crear un producto@@productFormNewTitle"
    >
      Nuevo producto
    </h1>

  }


  <!-- =====================================================
       LOADING
       ===================================================== -->

  @if (loading()) {

    <p
      class="admin-page__loading"
      i18n="Mensaje mostrado mientras se carga el producto@@productFormLoading"
    >
      Cargando…
    </p>

  } @else {

    <!-- ===================================================
         FORMULARIO
         =================================================== -->

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="panel form-grid"
    >

      <!-- ===============================================
           NOMBRE
           =============================================== -->

      <label class="field">

        <span
          i18n="Etiqueta del campo nombre del producto@@productFormName"
        >
          Nombre
        </span>

        <input
          type="text"
          formControlName="name"
          autocomplete="off"
        />

        @if (
          form.get('name')?.touched &&
          zodError(form.get('name')); as msg
        ) {

          <small class="field-error">
            {{ msg }}
          </small>

        }

      </label>


      <!-- ===============================================
           CATEGORÍA
           =============================================== -->

      <label class="field">

        <span
          i18n="Etiqueta del campo categoría del producto@@productFormCategory"
        >
          Categoría
        </span>

        <select formControlName="category">

          <option
            value=""
            disabled
            i18n="Opción inicial del selector de categorías@@productFormCategoryPlaceholder"
          >
            Seleccioná una categoría
          </option>

          @for (cat of categories(); track cat) {

            <option [value]="cat">
              {{ cat }}
            </option>

          }

        </select>

        @if (
          form.get('category')?.touched &&
          zodError(form.get('category')); as msg
        ) {

          <small class="field-error">
            {{ msg }}
          </small>

        }

      </label>


      <!-- ===============================================
           DESCRIPCIÓN
           =============================================== -->

      <label class="field form-grid__span2">

        <span
          i18n="Etiqueta del campo descripción del producto@@productFormDescription"
        >
          Descripción
        </span>

        <textarea
          formControlName="description"
          rows="4"
        ></textarea>

        @if (
          form.get('description')?.touched &&
          zodError(form.get('description')); as msg
        ) {

          <small class="field-error">
            {{ msg }}
          </small>

        }

      </label>


      <!-- ===============================================
           PRECIO
           =============================================== -->

      <label class="field">

        <span
          i18n="Etiqueta del campo precio del producto@@productFormPrice"
        >
          Precio (USD)
        </span>

        <input
          type="number"
          step="0.01"
          min="0"
          formControlName="price"
        />

        @if (
          form.get('price')?.touched &&
          zodError(form.get('price')); as msg
        ) {

          <small class="field-error">
            {{ msg }}
          </small>

        }

      </label>


      <!-- ===============================================
           STOCK
           =============================================== -->

      <label class="field">

        <span
          i18n="Etiqueta del campo stock del producto@@productFormStock"
        >
          Stock
        </span>

        <input
          type="number"
          step="1"
          min="0"
          formControlName="stock"
        />

        @if (
          form.get('stock')?.touched &&
          zodError(form.get('stock')); as msg
        ) {

          <small class="field-error">
            {{ msg }}
          </small>

        }

      </label>


      <!-- ===============================================
           IMAGEN PRINCIPAL
           =============================================== -->

      <label class="field form-grid__span2">

        <span
          i18n="Etiqueta de la URL de imagen principal@@productFormImageUrl"
        >
          URL de la imagen principal
        </span>

        <input
          type="url"
          formControlName="imageUrl"
          placeholder="https://…"
          autocomplete="off"
          i18n-placeholder="Placeholder para la URL de la imagen principal@@productFormImageUrlPlaceholder"
        />

        @if (
          form.get('imageUrl')?.touched &&
          zodError(form.get('imageUrl')); as msg
        ) {

          <small class="field-error">
            {{ msg }}
          </small>

        }

      </label>


      <!-- ===============================================
           GALERÍA
           =============================================== -->

      <label class="field form-grid__span2">

        <span
          i18n="Etiqueta de las imágenes adicionales de la galería@@productFormGallery"
        >
          Imágenes adicionales de la galería (URLs)
        </span>

        <textarea
          formControlName="images"
          rows="3"
          placeholder="https://imagen1.jpg, https://imagen2.jpg"
          i18n-placeholder="Placeholder para las URLs de imágenes adicionales@@productFormGalleryPlaceholder"
        ></textarea>

        <small
          class="field-help"
          i18n="Ayuda para ingresar las URLs de imágenes adicionales@@productFormGalleryHelp"
        >
          Ingresá las URLs separadas por comas.
        </small>

      </label>


      <!-- ===============================================
           INFORMACIÓN DE ENVÍO
           =============================================== -->

      <label class="field form-grid__span2">

        <span
          i18n="Etiqueta de la información de envío del producto@@productFormShippingInfo"
        >
          Información de envío
        </span>

        <input
          type="text"
          formControlName="shippingInfo"
          placeholder="Ej. Envío disponible a todo el país..."
          i18n-placeholder="Ejemplo de información de envío@@productFormShippingInfoPlaceholder"
        />

      </label>


      <!-- ===============================================
           ACCIONES
           =============================================== -->

      <div class="form-grid__span2 form-actions">

        @if (submitting()) {

          <button
            type="submit"
            class="btn btn-primary"
            disabled
            i18n="Botón mostrado mientras se guarda un producto@@productFormSaving"
          >
            Guardando…
          </button>

        } @else if (productId) {

          <button
            type="submit"
            class="btn btn-primary"
            i18n="Botón para guardar los cambios de un producto@@productFormSaveChanges"
          >
            Guardar cambios
          </button>

        } @else {

          <button
            type="submit"
            class="btn btn-primary"
            i18n="Botón para crear un producto@@productFormCreate"
          >
            Crear producto
          </button>

        }

        <a
          routerLink="/admin/products"
          class="btn btn-outline"
          i18n="Botón para cancelar el formulario de producto@@productFormCancel"
        >
          Cancelar
        </a>

      </div>

    </form>

  }

</div>
