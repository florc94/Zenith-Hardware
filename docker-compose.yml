version: "3.9"
services:
  mock-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install --omit=dev --include=dev json-server && node server.js"
    ports:
      - "3000:3000"

  frontend:
    build: .
    ports:
      - "4200:80"
    depends_on:
      - mock-api
